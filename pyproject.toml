[project]
name = "novel-agent"
version = "0.1.0"
description = "言情小说写作 Agent 系统"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0",
]

[project.optional-dependencies]
rag = ["chromadb>=0.5.0"]
openai = ["openai>=1.40.0"]   # DeepSeek / 通义 / GLM / Kimi / Ollama 等兼容端
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
novel-agent = "novel_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/novel_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
